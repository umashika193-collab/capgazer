name: "Autonomous Full-Pipeline Intelligence Updater"

on:
  # 平日の日本時間 毎朝 07:00 (UTC 22:00) に自動実行
  schedule:
    - cron: '0 22 * * 1-5'
  
  # GitHubのUIから手動でいつでもワンクリック実行可能
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-pipeline-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run 100% Full-Pipeline Autonomous Updater
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/full_pipeline_updater.py

      - name: Commit and Push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/latest_sec_status.json src/data/mockData.ts
          if git diff --staged --quiet; then
            echo "All sections are up to date. No commit needed."
          else
            git commit -m "chore(auto): 100% full-pipeline daily update (Inflows, Holdings, Feed, Trends) [skip ci]"
            git push
          fi
